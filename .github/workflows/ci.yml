name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Detection eval gate - labeled fixtures
        run: python scripts/eval_gate.py
      - name: CLI smoke - expects exit 2 when findings meet fail-on severity
        run: |
          code=0
          python -m oci_cost_anomaly.cli examples/cost-export.json --fail-on medium || code=$?
          test "$code" -eq 2
